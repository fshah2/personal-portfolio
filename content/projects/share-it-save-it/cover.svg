<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <radialGradient id="g1" cx="50%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="100%" r="85%">
      <stop offset="0%" stop-color="#ec5fc0" stop-opacity="0.30"/>
      <stop offset="62%" stop-color="#ec5fc0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#0b0b0f"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#g1)"/>
  <rect width="1600" height="1000" fill="url(#g2)"/>

  <!-- monogram -->
  <text x="800" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#e9e9e4">FS<tspan fill="#fb923c">.</tspan></text>

  <!-- category chip -->
  <rect x="754" y="222" width="92" height="48" rx="24" fill="#fb923c" fill-opacity="0.12" stroke="#fb923c" stroke-opacity="0.55"/>
  <text x="800" y="253" text-anchor="middle" font-family="ui-monospace, monospace" font-size="23" letter-spacing="2" fill="#fb923c">iOS</text>

  <!-- accent divider -->
  <rect x="764" y="352" width="72" height="5" fill="#fb923c"/>

<text x="800" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="108" font-weight="700" fill="#f5f5f2">Share It</text>
<text x="800" y="598" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="108" font-weight="700" fill="#f5f5f2">Save It</text>

  <text x="800" y="672" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#b9b9b3">Cross-app link bookmarking for iOS</text>

<rect x="550" y="812" width="121" height="54" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/><text x="610" y="847" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="25" fill="#cfcfca">Swift</text>
<rect x="688" y="812" width="87" height="54" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/><text x="732" y="847" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="25" fill="#cfcfca">iOS</text>
<rect x="794" y="812" width="257" height="54" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/><text x="922" y="847" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="25" fill="#cfcfca">Local Storage</text>

</svg>
